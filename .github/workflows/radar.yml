name: Update and publish Call Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'

concurrency:
  group: call-atlas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF reader
        run: python -m pip install pypdf==6.10.0
      - name: Check filtering and deadline rules
        run: |
          python -m unittest
          node --test rules.test.js
      - name: Check official sources and send verified updates
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector.py --notify
      - name: Publish already checked updates without another source scan
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector.py --offline --notify
      - name: Preserve checked data and notification receipts
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json journals.json feed.xml review-queue.json
          if [ -f notification-state.json ]; then git add notification-state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified CFP records and delivery receipts'
            git push
          fi
      - name: Prepare public website
        run: |
          mkdir -p _site
          cp index.html style.css app.js rules.js favicon.svg data.json feed.xml _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
